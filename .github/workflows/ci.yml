name: macOS checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate SQL invariants
        run: python3 scripts/validate_sql.py
      - name: Test and build universal application
        run: bash scripts/build.sh
      - name: Verify architectures
        run: lipo build/DerivedData/Build/Products/Release/ClipStack.app/Contents/MacOS/ClipStack -verify_arch arm64 x86_64
      - name: Package ad-hoc signed development build
        run: ditto -c -k --sequesterRsrc --keepParent build/DerivedData/Build/Products/Release/ClipStack.app build/ClipStack-development.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClipStack-development
          path: build/ClipStack-development.zip
